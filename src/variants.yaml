---
# The themes of the Opal family: Opal and its gemstone variants. Each one fills the
# fields of src/theme.template.yaml; script/build.py writes them all into
# themes/opal.yaml. Only the accent, the grounds and the three light spots differ.
#
# How the values are made (keep it when adding a variant):
# - palette: the accent in the lightness steps of Home Assistant's own primary palette
#   (OKLCH), step 40 = light.primary; white text on it must reach 4.5:1.
# - grounds, header, sidebar, surfaces: Opal's own neutrals turned to the accent's hue,
#   same lightness and chroma (Onyx with a third of the chroma).
# - spots: three light spots in the stone's tones, as "r, g, b".

- name: Opal
  slug: opal
  palette: {"05": "#0A112E", "10": "#192453", "20": "#253472", "30": "#3E54B0", "40": "#4F6BED", "50": "#7C9CFF",
            "60": "#9CB4FE", "70": "#B2C5FD", "80": "#D2DDFE", "90": "#E9EFFF", "95": "#F4F7FF"}
  light:
    primary: "#4F6BED"
    rgb_primary: "79, 107, 237"
    ground: "#EEF1FA"
    secondary: "#E4E8F5"
    ground_rgb: "238, 241, 250"
    sidebar_rgb: "245, 247, 253"
    spot1: "124, 156, 255"
    spot2: "45, 212, 191"
    spot3: "244, 114, 182"
  dark:
    primary: "#7C9CFF"
    rgb_primary: "124, 156, 255"
    ground: "#070B1A"
    secondary: "#0E1428"
    header_rgb: "9, 13, 30"
    sidebar_rgb: "11, 16, 34"
    card: "#141A36"
    surface: "#121833"
    surface_rgb: "18, 24, 51"
    code: "#0B1022"
    spot1: "124, 156, 255"
    spot2: "45, 212, 191"
    spot3: "244, 114, 182"

