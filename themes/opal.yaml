Opal Amethyst:
  # Shared by both modes
  card-mod-theme: Opal Amethyst
  # card-mod reads its styles only from the theme's top level, not from modes; the values
  # that differ between light and dark are the opal-* variables in each mode.
  card-mod-sidebar: |
    /* Frosted glass; matters most where the sidebar opens over the dashboard (phones). */
    :host {
      backdrop-filter: blur(24px) saturate(170%) !important;
      -webkit-backdrop-filter: blur(24px) saturate(170%) !important;
    }
  card-mod-root: |
    .header {
      --app-header-background-color: transparent;
      background: var(--opal-header-glass) !important;
      backdrop-filter: blur(24px) saturate(170%) !important;
      -webkit-backdrop-filter: blur(24px) saturate(170%) !important;
      border-bottom: 1px solid var(--opal-header-border);
      --wa-focus-ring-color: transparent;
    }
    .header .toolbar {
      background: transparent !important;
    }
    /* Editing a dashboard: tinted glass, and the edit controls in the theme's own colour. */
    .edit-mode .header {
      background: var(--opal-header-edit-glass) !important;
    }
    .edit-icon {
      color: var(--primary-color) !important;
    }
    #add-view ha-svg-icon {
      background-color: var(--primary-color) !important;
    }
    /* No focus frame left around a tapped view tab; the underline marks the active one. */
    .header ha-tab-group-tab,
    .header ha-tab-group-tab::part(base) {
      outline: none !important;
    }
  card-mod-card: |
    ha-card {
      background-image: var(--opal-card-sheen);
      transition: box-shadow 180ms ease, border-color 180ms ease;
    }
    ha-card:hover {
      border-color: var(--opal-card-hover-border);
      box-shadow: var(--opal-card-hover-shadow);
    }
    /* Tiles of lights that are on: border and glow in the light's colour. */
    ha-card.active:has(ha-tile-icon[data-domain="light"]) {
      border-color: color-mix(in srgb,
        var(--tile-color, var(--opal-active-fallback)) var(--opal-active-border), transparent);
      background-image: linear-gradient(135deg,
        color-mix(in srgb,
          var(--tile-color, var(--opal-active-fallback)) var(--opal-active-tint), transparent) 0%,
        var(--opal-active-tint-end) 60%);
      box-shadow: var(--opal-active-glow) color-mix(in srgb,
        var(--tile-color, var(--opal-active-fallback)) var(--opal-active-glow-mix), transparent);
    }
