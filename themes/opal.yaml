      sidebar-text-color: "rgba(255, 255, 255, 0.78)"
      sidebar-icon-color: "rgba(255, 255, 255, 0.70)"
      sidebar-selected-text-color: "#FFFFFF"
      sidebar-selected-icon-color: "#F472B6"
      sidebar-menu-button-text-color: "rgba(255, 255, 255, 0.92)"

      # Icons and states
      state-icon-color: "rgba(255, 255, 255, 0.78)"
      state-light-active-color: "#FBBF24"
      # Inactive states (off, clear, away): icons, the logbook's discs, history bars
      state-inactive-color: "#94A3B8"

      # Menus and dialogs
      mdc-theme-surface: "#2E0E17"
      ha-dialog-surface-background: "rgba(46, 14, 23, 0.82)"
      ha-dialog-surface-backdrop-filter: "blur(28px) saturate(170%)"

      # Form fields and selects (ha-color-form-* for current fields, input-* for older ones)
      ha-color-form-background: "rgba(255, 255, 255, 0.07)"
      ha-color-form-background-hover: "rgba(255, 255, 255, 0.11)"
      ha-color-form-background-disabled: "rgba(255, 255, 255, 0.03)"
      ha-color-border-neutral-loud: "rgba(255, 255, 255, 0.28)"
      input-fill-color: "rgba(255, 255, 255, 0.07)"
      input-disabled-fill-color: "rgba(255, 255, 255, 0.03)"
      input-ink-color: "rgba(255, 255, 255, 0.92)"
      input-label-ink-color: "rgba(255, 255, 255, 0.66)"
      input-idle-line-color: "rgba(255, 255, 255, 0.30)"
      input-hover-line-color: "rgba(255, 255, 255, 0.55)"
      input-dropdown-icon-color: "rgba(255, 255, 255, 0.70)"
      code-editor-background-color: "#1F090F"

      # Sliders (switches follow the ha-color-primary-* palette above)
      slider-color: "#F472B6"
      slider-track-color: "rgba(255, 255, 255, 0.15)"

      # Tables and lists
      table-row-background-color: "rgba(255, 255, 255, 0.03)"
      table-row-alternative-background-color: "rgba(255, 255, 255, 0.06)"
      data-table-background-color: "rgba(255, 255, 255, 0.04)"

      # Values for the card-mod styles at the top of the theme (card-mod reads only top-level keys)
      opal-header-glass: "rgba(27, 7, 12, 0.86)"
      opal-header-edit-glass: "color-mix(in srgb, #F472B6 18%, rgba(27, 7, 12, 0.86))"
      opal-header-border: "rgba(255, 255, 255, 0.07)"
      opal-card-sheen: "linear-gradient(135deg, rgba(255, 255, 255, 0.09) 0%, rgba(255, 255, 255, 0.015) 55%)"
      opal-card-hover-border: "rgba(255, 255, 255, 0.16)"
      opal-card-hover-shadow: "0 14px 40px rgba(0, 0, 0, 0.30)"
      opal-active-fallback: "#FBBF24"
      opal-active-border: "38%"
      opal-active-tint: "16%"
      opal-active-tint-end: "rgba(255, 255, 255, 0.02)"
      opal-active-glow: "0 12px 40px"
      opal-active-glow-mix: "20%"

Opal Onyx:
  # Shared by both modes
  card-mod-theme: Opal Onyx
  # card-mod reads its styles only from the theme's top level, not from modes; the values
  # that differ between light and dark are the opal-* variables in each mode.
  card-mod-sidebar: |
    /* Frosted glass; matters most where the sidebar opens over the dashboard (phones). */
    :host {
      backdrop-filter: blur(24px) saturate(170%) !important;
      -webkit-backdrop-filter: blur(24px) saturate(170%) !important;
    }
  card-mod-root: |
    .header {
      --app-header-background-color: transparent;
      background: var(--opal-header-glass) !important;
      backdrop-filter: blur(24px) saturate(170%) !important;
      -webkit-backdrop-filter: blur(24px) saturate(170%) !important;
      border-bottom: 1px solid var(--opal-header-border);
      --wa-focus-ring-color: transparent;
    }
    .header .toolbar {
      background: transparent !important;
    }
    /* Editing a dashboard: tinted glass, and the edit controls in the theme's own colour. */
    .edit-mode .header {
      background: var(--opal-header-edit-glass) !important;
    }
    .edit-icon {
      color: var(--primary-color) !important;
    }
    #add-view ha-svg-icon {
      background-color: var(--primary-color) !important;
    }
    /* No focus frame left around a tapped view tab; the underline marks the active one. */
    .header ha-tab-group-tab,
    .header ha-tab-group-tab::part(base) {
      outline: none !important;
    }
  card-mod-card: |
    ha-card {
      background-image: var(--opal-card-sheen);
      transition: box-shadow 180ms ease, border-color 180ms ease;
    }
    ha-card:hover {
      border-color: var(--opal-card-hover-border);
      box-shadow: var(--opal-card-hover-shadow);
    }
    /* Tiles of lights that are on: border and glow in the light's colour. */
    ha-card.active:has(ha-tile-icon[data-domain="light"]) {
      border-color: color-mix(in srgb,
        var(--tile-color, var(--opal-active-fallback)) var(--opal-active-border), transparent);
      background-image: linear-gradient(135deg,
        color-mix(in srgb,
          var(--tile-color, var(--opal-active-fallback)) var(--opal-active-tint), transparent) 0%,
        var(--opal-active-tint-end) 60%);
      box-shadow: var(--opal-active-glow) color-mix(in srgb,
        var(--tile-color, var(--opal-active-fallback)) var(--opal-active-glow-mix), transparent);
    }
  ha-font-family-body: "Inter, system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif"
  ha-card-border-width: "1px"
  ha-card-border-radius: "20px"
  ha-card-backdrop-filter: "blur(24px) saturate(170%)"
  ha-border-radius-sm: "10px"
  ha-dialog-border-radius: "28px"
  dialog-backdrop-filter: "blur(6px)"
  # The palette behind switches, buttons, checkboxes, radios, tabs, progress bars and
  # pickers (Home Assistant's own is cyan and ignores primary-color). The accent in the
  # lightness steps of HA's palette; step 40 is the light mode's primary-color.
  ha-color-primary-05: "#090D16"
  ha-color-primary-10: "#0F172A"
  ha-color-primary-20: "#172033"
  ha-color-primary-30: "#1E293B"
  ha-color-primary-40: "#334155"
  ha-color-primary-50: "#9BADC9"
  ha-color-primary-60: "#A6B9D4"
  ha-color-primary-70: "#BAC8DC"
  ha-color-primary-80: "#D7DFEA"
  ha-color-primary-90: "#ECEFF4"
  ha-color-primary-95: "#F5F7FA"

  modes:
    # ----------------------------------------------------------------------------------
    light:
      # Base colours (stronger than in dark mode, for contrast on a light ground)
      primary-color: "#334155"
      rgb-primary-color: "51, 65, 85"
      accent-color: "#0D9488"
      rgb-accent-color: "13, 148, 136"
      primary-background-color: "#F0F1F4"
      secondary-background-color: "#E6E8EC"

      # Text
      primary-text-color: "#0F172A"
      rgb-primary-text-color: "15, 23, 42"
      secondary-text-color: "#475569"
      disabled-text-color: "#94A3B8"
      text-primary-color: "#FFFFFF"
      divider-color: "rgba(15, 23, 42, 0.10)"

      # Dashboard background: three soft light spots on a pale ground
      lovelace-background: >-
        radial-gradient(circle at 8% 0%, rgba(148, 163, 184, 0.45) 0%, rgba(148, 163, 184, 0) 45%) fixed,
        radial-gradient(circle at 96% 42%, rgba(203, 213, 225, 0.30) 0%, rgba(203, 213, 225, 0) 40%) fixed,
        radial-gradient(circle at 42% 108%, rgba(100, 116, 139, 0.26) 0%, rgba(100, 116, 139, 0) 42%) fixed,
        #F0F1F4

      # The same light behind every other page and behind the sidebar (a dashboard paints
      # its own background only beside the sidebar); toolbars that would take it stay plain.
      ha-panel-background: >-
        radial-gradient(circle at 8% 0%, rgba(148, 163, 184, 0.45) 0%, rgba(148, 163, 184, 0) 45%) fixed,
        radial-gradient(circle at 96% 42%, rgba(203, 213, 225, 0.30) 0%, rgba(203, 213, 225, 0) 40%) fixed,
        radial-gradient(circle at 42% 108%, rgba(100, 116, 139, 0.26) 0%, rgba(100, 116, 139, 0) 42%) fixed,
        #F0F1F4
      ha-panel-toolbar-background: "#F0F1F4"

      # Cards: white frosted glass. card-background-color is also the surface of
      # drop-down menus, so it stays opaque; cards use ha-card-background.
      card-background-color: "#FFFFFF"
      ha-card-background: "rgba(255, 255, 255, 0.55)"
      ha-card-border-color: "rgba(255, 255, 255, 0.75)"
      ha-card-box-shadow: "0 10px 30px rgba(15, 23, 42, 0.08)"

      # Header and sidebar
      app-header-background-color: "rgba(240, 241, 244, 0.96)"
      app-header-text-color: "#0F172A"
      app-header-selection-bar-color: "#334155"
      # Editing a dashboard: the header tinted with the accent, the text stays dark
      app-header-edit-background-color: "color-mix(in srgb, #334155 12%, rgb(240, 241, 244))"
      app-header-edit-text-color: "#0F172A"
      # Translucent: the coloured light behind the page shows through the sidebar
      sidebar-background-color: "rgba(246, 247, 249, 0.5)"
      sidebar-text-color: "#334155"
      sidebar-icon-color: "#475569"
      sidebar-selected-text-color: "#0F172A"
      sidebar-selected-icon-color: "#334155"
      sidebar-menu-button-text-color: "#0F172A"

      # Icons and states
      state-icon-color: "#475569"
      state-light-active-color: "#F59E0B"
      # Inactive states (off, clear, away): icons, the logbook's discs, history bars
      state-inactive-color: "#64748B"

      # Menus and dialogs
      mdc-theme-surface: "#FFFFFF"
      ha-dialog-surface-background: "rgba(255, 255, 255, 0.86)"
      ha-dialog-surface-backdrop-filter: "blur(28px) saturate(170%)"

      # Form fields and selects (ha-color-form-* for current fields, input-* for older ones)
      ha-color-form-background: "rgba(15, 23, 42, 0.05)"
      ha-color-form-background-hover: "rgba(15, 23, 42, 0.08)"
      ha-color-form-background-disabled: "rgba(15, 23, 42, 0.03)"
      ha-color-border-neutral-loud: "rgba(15, 23, 42, 0.30)"
      input-fill-color: "rgba(15, 23, 42, 0.05)"
      input-ink-color: "#0F172A"
      input-label-ink-color: "#475569"
      input-idle-line-color: "rgba(15, 23, 42, 0.30)"
      input-hover-line-color: "rgba(15, 23, 42, 0.55)"
      input-dropdown-icon-color: "#475569"

      # Sliders (switches follow the ha-color-primary-* palette above)
      slider-color: "#334155"
      slider-track-color: "rgba(15, 23, 42, 0.12)"

      # Tables and lists
      table-row-background-color: "rgba(255, 255, 255, 0.50)"
      table-row-alternative-background-color: "rgba(255, 255, 255, 0.70)"
      data-table-background-color: "rgba(255, 255, 255, 0.60)"

      # Values for the card-mod styles at the top of the theme (card-mod reads only top-level keys)
      opal-header-glass: "rgba(240, 241, 244, 0.86)"
      opal-header-edit-glass: "color-mix(in srgb, #334155 12%, rgba(240, 241, 244, 0.86))"
      opal-header-border: "rgba(15, 23, 42, 0.06)"
      opal-card-sheen: "linear-gradient(135deg, rgba(255, 255, 255, 0.55) 0%, rgba(255, 255, 255, 0.10) 60%)"
      opal-card-hover-border: "rgba(255, 255, 255, 0.95)"
      opal-card-hover-shadow: "0 14px 40px rgba(15, 23, 42, 0.12)"
      opal-active-fallback: "#F59E0B"
      opal-active-border: "45%"
      opal-active-tint: "18%"
      opal-active-tint-end: "rgba(255, 255, 255, 0.10)"
      opal-active-glow: "0 12px 36px"
      opal-active-glow-mix: "22%"

    # ----------------------------------------------------------------------------------
    dark:
      # Base colours
      primary-color: "#CBD5E1"
      rgb-primary-color: "203, 213, 225"
      accent-color: "#2DD4BF"
      rgb-accent-color: "45, 212, 191"
      primary-background-color: "#090C10"
